<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Nostalgia | Personalized Invitation</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #100b0b;
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
}

header {
  text-align: center;
  padding: 34px 18px 22px;
}

header .brand {
  color: #c7a06a;
  letter-spacing: 4px;
  font-size: 12px;
}

header h1 {
  font-size: 36px;
  font-weight: normal;
  font-style: italic;
  margin: 12px 0 8px;
}

header p {
  font-size: 12px;
  letter-spacing: 2px;
  color: #d8c8b6;
}

.panel {
  max-width: 520px;
  margin: 0 auto 25px;
  padding: 22px;
  text-align: center;
  background: #201615;
  border: 1px solid #66503d;
  border-radius: 14px;
}

.panel h2 {
  font-size: 18px;
  font-weight: normal;
  letter-spacing: 2px;
}

input {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 18px 0 12px;
  border: 1px solid #aa895e;
  border-radius: 7px;
  font-size: 17px;
  text-align: center;
}

button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 7px;
  background: #c7a06a;
  color: #1b110d;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: transparent;
  border: 1px solid #c7a06a;
  color: #f4d4a7;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

#status {
  min-height: 20px;
  margin-top: 12px;
  font-size: 13px;
  color: #e9d0ab;
}

.invitation {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

.invitation img {
  display: block;
  width: 100%;
  height: auto;
  -webkit-touch-callout: default;
}

.actions {
  max-width: 520px;
  margin: 20px auto 35px;
  padding: 0 20px;
}

#guestActions { display: none; }

@media (max-width: 560px) {
  .panel {
    margin: 0 15px 22px;
  }
  header h1 { font-size: 32px; }
}

@media print {
  header, .panel, .actions { display: none !important; }
  body { background: white; }
  .invitation { max-width: none; }
}
</style>
</head>

<body>

<header id="pageHeader">
  <div class="brand">THE VINTAGE PULSE</div>
  <h1>The Nostalgia</h1>
  <p>PERSONALIZED INVITATION</p>
</header>

<div class="panel" id="generator">
  <h2>CREATE YOUR INVITATION</h2>

  <input
    id="nameInput"
    type="text"
    placeholder="Guest Name"
    autocomplete="off"
  >

  <button id="generateButton">
    Generate Invitation
  </button>

  <div id="generatedActions" style="display:none">
    <button class="secondary" id="copyLinkButton">
      Copy Invitation Link
    </button>
    <button class="secondary" id="openLinkButton">
      Open Invitation
    </button>
  </div>

  <div id="status" role="status"></div>
</div>

<div class="invitation">
  <img
    id="invitationImage"
    src="IMG_0638.jpeg"
    alt="The Nostalgia Invitation"
  >
</div>

<div class="actions" id="guestActions">
  <button id="copyImageButton">Copy Image</button>
  <button class="secondary" id="downloadButton">
    Download Image
  </button>
  <div id="guestStatus" role="status"></div>
</div>

<script>
const image = document.getElementById("invitationImage");
const generator = document.getElementById("generator");
const guestActions = document.getElementById("guestActions");
const status = document.getElementById("status");
const guestStatus = document.getElementById("guestStatus");

const params = new URLSearchParams(location.search);
const guest = (params.get("name") || "").trim();

let personalizedBlob = null;
let generatedURL = "";

function waitForImage(img) {
  return new Promise((resolve, reject) => {
    if (img.complete && img.naturalWidth > 0) {
      resolve();
      return;
    }
    img.addEventListener("load", resolve, { once: true });
    img.addEventListener("error", () => {
      reject(new Error("Invitation image could not load."));
    }, { once: true });
  });
}

function drawGuestName(ctx, width, height, name) {
  const text = name.toUpperCase().trim();
  const x = width * 0.05;
  const y = height * 0.14;
  const maxWidth = width * 0.45;

  // Font size is relative to image width, not phone screen.
  let fontSize = width * 0.047;
  const minFontSize = width * 0.025;

  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillStyle = "#ffffff";

  ctx.shadowColor = "rgba(0,0,0,0.85)";
  ctx.shadowBlur = width * 0.009;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = width * 0.003;

  function wrap(size) {
    ctx.font = `${size}px "Times New Roman", Georgia, serif`;
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";

    for (const word of words) {
      const candidate = line ? line + " " + word : word;

      if (line && ctx.measureText(candidate).width > maxWidth) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
    }

    if (line) lines.push(line);
    return lines;
  }

  let lines = wrap(fontSize);

  // Fit the name into a maximum of two lines where possible.
  while (lines.length > 2 && fontSize > minFontSize) {
    fontSize *= 0.95;
    lines = wrap(fontSize);
  }

  ctx.font = `${fontSize}px "Times New Roman", Georgia, serif`;

  const lineHeight = fontSize * 1.18;

  lines.forEach((line, index) => {
    ctx.fillText(
      line,
      x,
      y + index * lineHeight,
      maxWidth
    );
  });
}

async function makePersonalizedImage(name) {
  await waitForImage(image);

  // Keep a reference to the original image before replacing it.
  const canvas = document.createElement("canvas");
  canvas.width = image.naturalWidth;
  canvas.height = image.naturalHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(image, 0, 0);

  drawGuestName(
    ctx,
    canvas.width,
    canvas.height,
    name
  );

  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("Could not create image."));
    }, "image/png");
  });
}

async function copyText(value) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(value);
  } else {
    const field = document.createElement("textarea");
    field.value = value;
    document.body.appendChild(field);
    field.select();
    document.execCommand("copy");
    field.remove();
  }
}

document.getElementById("generateButton").onclick = () => {
  const name = document.getElementById("nameInput").value.trim();

  if (!name) {
    status.textContent = "Please enter a guest name.";
    return;
  }

  const url = new URL(location.href);
  url.searchParams.set("name", name);
  generatedURL = url.href;

  document.getElementById("generatedActions").style.display = "block";
  status.textContent = "Invitation link is ready.";
};

document.getElementById("copyLinkButton").onclick = async () => {
  try {
    await copyText(generatedURL);
    status.textContent = "Invitation link copied!";
  } catch {
    status.textContent = "Please copy the link manually.";
    window.prompt("Copy invitation link:", generatedURL);
  }
};

document.getElementById("openLinkButton").onclick = () => {
  if (generatedURL) location.href = generatedURL;
};

document.getElementById("copyImageButton").onclick = async () => {
  if (!personalizedBlob) return;

  try {
    if (!navigator.clipboard || !window.ClipboardItem) {
      throw new Error("Clipboard image not supported.");
    }

    await navigator.clipboard.write([
      new ClipboardItem({
        "image/png": personalizedBlob
      })
    ]);

    guestStatus.textContent = "Image copied with guest name!";
  } catch {
    guestStatus.textContent =
      "Copy Image isn't supported here. Use Download Image instead.";
  }
};

document.getElementById("downloadButton").onclick = () => {
  if (!personalizedBlob) return;

  const url = URL.createObjectURL(personalizedBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "The-Nostalgia-Invitation.png";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 60000);
};

async function initializeGuest() {
  if (!guest) return;

  generator.style.display = "none";
  guestActions.style.display = "block";

  const copyButton = document.getElementById("copyImageButton");
  const downloadButton = document.getElementById("downloadButton");

  copyButton.disabled = true;
  downloadButton.disabled = true;
  guestStatus.textContent = "Preparing your invitation...";

  try {
    personalizedBlob = await makePersonalizedImage(guest);

    const personalizedURL = URL.createObjectURL(personalizedBlob);

    image.src = personalizedURL;

    copyButton.disabled = false;
    downloadButton.disabled = false;

    guestStatus.textContent = "";
  } catch (error) {
    guestStatus.textContent =
      "Could not prepare the image. Please refresh.";
  }
}

initializeGuest();
</script>

</body>
</html>
