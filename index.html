<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Nostalgia | SASS Bar Invitation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080606;
    color: white;
    font-family: "Times New Roman", serif;
}

/* INVITATION */

.invitation {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

.invitation img {
    display: block;
    width: 100%;
    height: auto;
}

/* GUEST NAME */

.guest-name {
    position: absolute;

    top: 14%;
    left: 5%;

    width: 45%;

    text-align: left;

    font-family: "Times New Roman", serif;
    font-size: clamp(18px, 5vw, 32px);
    font-weight: normal;

    text-transform: uppercase;
    letter-spacing: 2px;

    color: #ffffff;

    overflow-wrap: break-word;

    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}

/* GENERATOR */

.generator {
    max-width: 600px;
    margin: 25px auto;
    padding: 20px;
    text-align: center;
}

.generator h2 {
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 2px;
    color: #ffffff;
}

.generator input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 12px;

    border: 1px solid #b58b56;
    border-radius: 6px;

    background: #ffffff;
    color: #000000;
}

.generator button {
    padding: 14px 22px;

    background: #b58b56;
    color: black;

    border: none;
    border-radius: 6px;

    font-size: 16px;
    cursor: pointer;
}

#link {
    margin-top: 20px;
    word-break: break-all;
    font-size: 14px;
    line-height: 1.7;
}

#link a {
    color: #ffffff;
}

.copy-button {
    display: block;
    margin: 15px auto;
}

/* PRINT LAYOUT */

@media print {

    @page {
        margin: 0;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: white;
    }

    .generator {
        display: none !important;
    }

    .invitation {
        width: 100%;
        max-width: none;
        margin: 0;
        break-inside: avoid;
        page-break-inside: avoid;
    }

    .invitation img {
        width: 100%;
        height: auto;
    }

    .guest-name {
        color: #ffffff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}

</style>
</head>

<body>

<!-- INVITATION IMAGE -->

<div class="invitation">

    <img
        src="IMG_0638.jpeg"
        alt="SASS Bar Invitation"
    >

    <div
        class="guest-name"
        id="guestName">
    </div>

</div>


<!-- PERSONALIZED INVITATION GENERATOR -->

<div class="generator" id="generator">

    <h2>PERSONALIZED INVITATION</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter guest name"
    >

    <button onclick="generateLink()">
        Generate Invitation
    </button>

    <div id="link"></div>

</div>


<script>

/* READ GUEST NAME FROM URL */

const params = new URLSearchParams(window.location.search);

const guest = params.get("name");

if (guest) {

    document.getElementById("guestName").textContent =
        guest.toUpperCase();

    document.getElementById("generator").style.display =
        "none";

}


/* GENERATE PERSONALIZED LINK */

function generateLink() {

    const name = document
        .getElementById("nameInput")
        .value
        .trim();

    if (!name) {

        alert("Please enter guest name");

        return;
    }

    const url = new URL(window.location.href);

    url.searchParams.set("name", name);

    const linkDiv = document.getElementById("link");

    linkDiv.innerHTML = "";

    const anchor = document.createElement("a");

    anchor.href = url.href;
    anchor.textContent = url.href;
    anchor.target = "_blank";

    linkDiv.appendChild(anchor);


    /* COPY LINK BUTTON */

    const copyButton = document.createElement("button");

    copyButton.textContent = "Copy Invitation Link";

    copyButton.className = "copy-button";

    copyButton.onclick = async function() {

        try {

            await navigator.clipboard.writeText(url.href);

            copyButton.textContent = "Link Copied!";

        } catch (error) {

            alert("Please copy the link manually.");

        }

    };

    linkDiv.appendChild(copyButton);

}

</script>

</body>
</html>
