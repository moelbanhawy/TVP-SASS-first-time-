<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Nostalgia | SASS Invitation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080606;
    color: white;
    font-family: "Times New Roman", serif;
}

.invitation {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

.invitation img {
    display: block;
    width: 100%;
    height: auto;
}

/* GENERATOR */

.generator {
    max-width: 600px;
    margin: 25px auto;
    padding: 20px;
    text-align: center;
}

.generator h2 {
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 2px;
}

.generator input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 12px;
    border: 1px solid #b58b56;
    border-radius: 6px;
}

.generator button {
    padding: 14px 22px;
    background: #b58b56;
    color: black;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

#link {
    margin-top: 20px;
    word-break: break-all;
    line-height: 1.7;
}

#link a {
    color: white;
}

.copy-button {
    display: block;
    margin: 15px auto;
}

@media print {
    @page {
        margin: 0;
    }

    body {
        background: white;
    }

    .generator {
        display: none !important;
    }

    .invitation {
        max-width: none;
    }
}
</style>
</head>

<body>

<div class="invitation">
    <img
        id="invitationImage"
        src="IMG_0638.jpeg"
        alt="Personalized SASS Invitation"
    >
</div>

<div class="generator" id="generator">

    <h2>PERSONALIZED INVITATION</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter guest name"
    >

    <button onclick="generateLink()">
        Generate Invitation
    </button>

    <div id="link"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const guest = params.get("name");

const invitationImage =
    document.getElementById("invitationImage");

if (guest && guest.trim()) {

    document.getElementById("generator").style.display =
        "none";

    invitationImage.onload = function() {
        createPersonalizedImage(guest);
    };

    if (invitationImage.complete &&
        invitationImage.naturalWidth > 0) {

        createPersonalizedImage(guest);
    }
}

function createPersonalizedImage(name) {

    // Prevent processing the generated image again
    invitationImage.onload = null;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const originalWidth = invitationImage.naturalWidth;
    const originalHeight = invitationImage.naturalHeight;

    canvas.width = originalWidth;
    canvas.height = originalHeight;

    // Draw original invitation
    ctx.drawImage(
        invitationImage,
        0,
        0,
        originalWidth,
        originalHeight
    );

    // Guest name appearance
    const fontSize = originalWidth * 0.052;

    ctx.font = fontSize + 'px "Times New Roman", serif';
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    ctx.shadowColor = "rgba(0,0,0,0.9)";
    ctx.shadowBlur = originalWidth * 0.012;
    ctx.shadowOffsetY = originalWidth * 0.003;

    const x = originalWidth * 0.05;
    const y = originalHeight * 0.14;
    const maxWidth = originalWidth * 0.45;

    // Wrap long names into multiple lines
    const words = name.toUpperCase().trim().split(/\s+/);
    const lines = [];
    let currentLine = "";

    for (const word of words) {

        const testLine = currentLine
            ? currentLine + " " + word
            : word;

        if (
            ctx.measureText(testLine).width > maxWidth &&
            currentLine
        ) {
            lines.push(currentLine);
            currentLine = word;
        } else {
            currentLine = testLine;
        }
    }

    if (currentLine) {
        lines.push(currentLine);
    }

    const lineHeight = fontSize * 1.15;

    lines.forEach((line, index) => {

        ctx.fillText(
            line,
            x,
            y + index * lineHeight,
            maxWidth
        );

    });

    // Replace the actual image with the personalized image
    invitationImage.src = canvas.toDataURL("image/png");

}

function generateLink() {

    const name = document
        .getElementById("nameInput")
        .value
        .trim();

    if (!name) {
        alert("Please enter guest name");
        return;
    }

    const url = new URL(window.location.href);
    url.searchParams.set("name", name);

    const linkDiv = document.getElementById("link");
    linkDiv.innerHTML = "";

    const anchor = document.createElement("a");
    anchor.href = url.href;
    anchor.textContent = url.href;
    anchor.target = "_blank";

    linkDiv.appendChild(anchor);

    const copyButton = document.createElement("button");
    copyButton.textContent = "Copy Invitation Link";
    copyButton.className = "copy-button";

    copyButton.onclick = async function() {

        try {
            await navigator.clipboard.writeText(url.href);
            copyButton.textContent = "Link Copied!";
        } catch (error) {
            alert("Please copy the link manually.");
        }

    };

    linkDiv.appendChild(copyButton);
}

</script>

</body>
</html>
